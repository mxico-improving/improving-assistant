[project]
name = "improving-assistant"
version = "0.1.0"
description = "Automates Improving admin tasks: Workday timesheets and Engage activity logging."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.45"]

[project.scripts]
improving-assistant = "improving_assistant.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/improving_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
